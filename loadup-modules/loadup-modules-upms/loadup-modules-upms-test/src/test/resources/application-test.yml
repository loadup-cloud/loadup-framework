# Test Application Configuration
spring:
  application:
    name: loadup-upms-test
  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: LoadupUpmsTestPool
      minimum-idle: 2
      maximum-pool-size: 10
      auto-commit: true
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
    # url/username/password 由 Testcontainers 自动注入，无需手动配置

testcontainers:
  reuse:
    enable: true   # 本地开发启用重用，加快测试速度

logging:
  level:
    root: INFO
    io.github.loadup.modules.upms: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG

loadup:
  modules:
    upms:
      security:
        jwt:
          # Test-only signing key. Production deployments must supply their own strong secret.
          secret: loadup-test-only-hs256-key-0123456789abcdef
  tracer:
    enabled: false
