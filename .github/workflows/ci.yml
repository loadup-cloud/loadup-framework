name: Build and Test

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  MAVEN_OPTS: -Xmx2048m -Djava.awt.headless=true
  TZ: Asia/Shanghai

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  verify:
    name: Tests, Quality and Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'false'
      TESTCONTAINERS_CHECKS_DISABLE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Test repository tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Configure Testcontainers
        run: |
          cp .github/testcontainers.properties "$HOME/.testcontainers.properties"
          docker info
      - name: Build once, run unit and integration tests, enforce quality gates
        run: |
          mvnd -B -ntp -T 1 clean install pmd:check checkstyle:check \
            -DskipTests=false -Dskip.unit.tests=false -Dskip.integration.tests=false \
            -Dskip.spotbugs=false -Dskip.spotless=false -Dlicense.skip=false \
            -Dskip.enforcer=false -Dskip.pmd=false -Dskip.checkstyle=false \
            -Dtestcontainers.reuse.enable=false -Dspring.profiles.active=ci
      - name: Enforce 90 percent line and branch coverage per component jar
        run: |
          jacoco_version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").findtext("{*}properties/{*}jacoco-plugin.version"))')
          mvnd -B -ntp -N org.apache.maven.plugins:maven-dependency-plugin:3.11.0:copy \
            "-Dartifact=org.jacoco:org.jacoco.cli:${jacoco_version}:jar:nodeps" \
            "-DoutputDirectory=$RUNNER_TEMP/jacoco"
          python3 tools/component-coverage.py \
            --jacoco-cli "$RUNNER_TEMP/jacoco/org.jacoco.cli-${jacoco_version}-nodeps.jar" \
            --minimum 0.90
      - name: Add coverage summary
        if: always()
        run: |
          if [[ -f loadup-components/target/coverage/summary.md ]]; then
            cat loadup-components/target/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Cache vulnerability database
        if: github.event_name != 'pull_request'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-13-${{ runner.os }}-
      - name: Scan dependencies with OWASP
        if: github.event_name != 'pull_request'
        timeout-minutes: 30
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          dependency_check_version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").findtext("{*}properties/{*}dependency-check-plugin.version"))')
          mvnd -B -ntp "org.owasp:dependency-check-maven:${dependency_check_version}:aggregate" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            "-DdataDirectory=$HOME/.cache/dependency-check" \
            -DfailBuildOnCVSS=7 -DfailOnError=true -Dformat=ALL \
            -DossIndexAnalyzerEnabled=false
      - name: Show container state on failure
        if: failure()
        run: docker ps -a
      - name: Upload test, quality, coverage and security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/spotbugsXml.xml
            **/target/pmd.xml
            **/target/checkstyle-result.xml
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
            loadup-components/target/coverage/**
            **/target/dependency-check-report.*

  publish:
    name: Publish GitHub Packages
    needs: verify
    if: >-
      github.event_name == 'push' && vars.PUBLISH_PACKAGES == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: github-packages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Publish to the existing cross-repository package registry
        env:
          PACKAGES_USERNAME: ${{ vars.PACKAGES_USERNAME }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          : "${PACKAGES_USERNAME:?Set the PACKAGES_USERNAME repository variable}"
          : "${PACKAGES_TOKEN:?Set PACKAGES_TOKEN with access to loadup-cloud/loadup-packages}"
          mvnd -B -ntp -T 1 clean deploy -P github \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/loadup-cloud/loadup-packages \
            -DdeployAtEnd=true -DskipTests -Dskip.spotbugs=true
