name: Build and Test

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, develop, dev ]
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish framework packages after all checks pass (main, develop or dev only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  MAVEN_OPTS: -Xmx2048m -Djava.awt.headless=true
  TZ: Asia/Shanghai

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  lint:
    name: Backend Fast Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Check formatting, licenses, dependency rules without compilation
        run: |
          spotless_version=$(python3 -c 'import xml.etree.ElementTree as E; p=E.parse("pom.xml").find("{*}properties"); print(p.findtext("{*}spotless-plugin.version"))')
          mvn -B -ntp -U -T 1 validate \
            "com.diffplug.spotless:spotless-maven-plugin:$spotless_version:check" \
            -Dskip.spotless=false -Dskip.enforcer=false

  verify:
    name: Backend Tests and Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'false'
      TESTCONTAINERS_CHECKS_DISABLE: 'false'
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Configure Testcontainers
        run: |
          cp .github/testcontainers.properties "$HOME/.testcontainers.properties"
          docker info
      - name: Build once and run tests
        id: build
        run: |
          mvn -B -ntp -U -T 1 -Pcomponent-coverage clean install \
            -DskipTests=false -Dskip.unit.tests=false -Dskip.integration.tests=false \
            -Dskip.enforcer=true \
            -Dtestcontainers.reuse.enable=false -Dspring.profiles.active=ci
      - name: Enforce 90 percent line and branch coverage per component jar
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Reuse exactly the bytecode and merged execution data from the successful build.
        # The standalone BOM does not inherit the parent's named plugin executions.
        run: |
          mvn -B -ntp -T 1 -Pcomponent-coverage -pl '!loadup-dependencies' --fail-at-end \
            enforcer:enforce@component-coverage-inputs \
            jacoco:check@component-coverage-check
      - name: Show container state on failure
        if: failure()
        run: docker ps -a
      - name: Upload test, quality and coverage reports
        if: always()
        uses: actions/upload-artifact@v7 # v7
        with:
          name: verification-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
            **/target/jacoco-unit.exec
            **/target/jacoco-it.exec
            loadup-coverage/target/jacoco-components.exec

  quality-gate:
    name: Tests, Quality and Coverage
    needs: [ lint, verify ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require quality and test checks to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$LINT_RESULT" != success || "$VERIFY_RESULT" != success ]]; then
            echo "Backend checks did not pass: lint=$LINT_RESULT verify=$VERIFY_RESULT" >&2
            exit 1
          fi
          echo 'All backend checks passed.'

  publish:
    name: Publish GitHub Packages
    needs: quality-gate
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish-packages)) &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: github-packages
      cancel-in-progress: false
    env:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Require cross-repository publishing credentials
        run: |
          : "${OSSRH_USERNAME:?Set OSSRH_USERNAME to the GitHub username that owns the token}"
          : "${OSSRH_TOKEN:?Set OSSRH_TOKEN to a classic PAT with write:packages and access to loadup-cloud/loadup-packages}"
      - uses: ./.github/actions/setup-build
      - name: Publish snapshots to GitHub Packages
        run: |
          mvn -B -ntp -U -T 1 clean deploy -P github \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/loadup-cloud/loadup-packages \
            -DdeployAtEnd=true -DskipTests
