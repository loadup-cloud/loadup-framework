spring:
  profiles:
    active: test
loadup:
  kms:
    enabled: true
    binder: local
    local:
      key-store-type: PKCS12
      key-store-password-env: LOADUP_TEST_KEYSTORE_PASSWORD
  security:
    auth-server:
      issuer: http://localhost:8080
      audience: loadup-api
      protocol-endpoints-enabled: true
      signing:
        active-key:
          name: auth-integration
          version: 1
      clients:
        - client-id: loadup-app
          client-secret: change-me
          scopes:
            - openid
          redirect-uris:
            - http://127.0.0.1:8080/login/oauth2/code/loadup
          grant-types:
            - authorization_code
            - client_credentials
            - refresh_token
