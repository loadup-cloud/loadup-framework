# LoadUp Tracer default configuration
# Override any key in your application.yml or application-{profile}.yml.
loadup:
  tracer:
    enabled: true
    enable-web-tracing: true
    enable-async-tracing: true
    include-headers: false
    include-parameters: false
    exclude-patterns: /actuator/**,/health,/metrics
    sampler-ratio: 1.0
    # Optional custom resource attributes:
    # attributes:
    #   environment: production
    #   region: us-east-1

    # Exporter list – multiple entries fan-out via composite.
    # Omit entirely to fall back to the built-in logging exporter.
    exporters:
      - type: logging      # logging | otlp | zipkin | noop
        # endpoint:        # required for otlp / zipkin
        timeout: 10000

    batch:
      max-queue-size: 2048
      max-export-batch-size: 512
      schedule-delay-millis: 5000

