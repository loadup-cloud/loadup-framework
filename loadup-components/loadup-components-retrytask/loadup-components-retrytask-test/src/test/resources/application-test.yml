spring:
  application:
    name: retrytask-test

jobrunr:
  background-job-server:
    enabled: true
    poll-interval-in-seconds: 5
    worker-count: 2
  dashboard:
    enabled: false
  jobs:
    default-number-of-retries: 10
    retry-back-off-time-seed: 3

loadup:
  retrytask:
    biz-types:
      failing:
        max-retries: 1
      recording:
        max-retries: 2

logging:
  level:
    io.github.loadup.retrytask: DEBUG
    org.jobrunr: INFO
