spring:
  application:
    name: retrytask-test

jobrunr:
  background-job-server:
    enabled: true
    poll-interval-in-seconds: 5
    worker-count: 2
  dashboard:
    enabled: false

loadup:
  retrytask:
    biz-types:
      failing:
        max-retries: 1
      retry-again:
        max-retries: 1
      reset:
        max-retries: 1

testcontainers:
  reuse:
    enable: false

logging:
  level:
    root: WARN
    io.github.loadup.retrytask: INFO
