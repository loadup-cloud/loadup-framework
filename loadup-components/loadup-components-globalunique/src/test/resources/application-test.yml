spring:
  application:
    name: globalunique-test
  flyway:
    enabled: true

loadup:
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
    validate-on-migrate: false
    clean-disabled: false
    table: flyway_schema_history_globalunique
  global-unique:
    enabled: true
  database:
    multi-tenant:
      enabled: true
      required: true
      default-tenant-id: test-tenant

logging:
  level:
    io.github.loadup.components.globalunique: DEBUG
