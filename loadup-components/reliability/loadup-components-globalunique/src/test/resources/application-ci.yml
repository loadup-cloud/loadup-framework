spring:
  application:
    name: globalunique-test
  flyway:
    enabled: true

loadup:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false
    clean-disabled: false
    table: flyway_schema_history_globalunique
  global-unique:
    enabled: true

logging:
  level:
    io.github.loadup.components.globalunique: DEBUG
