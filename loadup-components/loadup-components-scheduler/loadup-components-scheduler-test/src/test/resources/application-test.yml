spring:
  application:
    name: scheduler-test
  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: 2

jobrunr:
  background-job-server:
    enabled: true
    poll-interval-in-seconds: 5
    worker-count: 2
  dashboard:
    enabled: false

logging:
  level:
    io.github.loadup.components.scheduler: DEBUG
    org.jobrunr: INFO
