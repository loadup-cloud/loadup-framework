# yaml-language-server: $schema=../loadup-gateway/plugins/repository-yaml-plugin/src/main/resources/gateway-routes-schema.json

routes:
  # ========================================
  # Authentication
  # ========================================
  - id: auth-login
    path: /api/auth/login
    method: POST
    backend:
      protocol: bean
      beanName: authenticationServiceImpl
      methodName: login
    securityCode: OFF

  - id: auth-register
    path: /api/auth/register
    method: POST
    backend:
      protocol: bean
      beanName: authenticationServiceImpl
      methodName: register
    securityCode: OFF

  - id: auth-refresh
    path: /api/auth/refresh
    method: POST
    backend:
      protocol: bean
      beanName: authenticationServiceImpl
      methodName: refreshToken
    securityCode: OFF

  - id: auth-logout
    path: /api/auth/logout
    method: POST
    backend:
      protocol: bean
      beanName: authenticationServiceImpl
      methodName: logout
    securityCode: OFF

  # ========================================
  # User Management
  # ========================================
  - id: user-create
    path: /api/upms/user/create
    method: POST
    backend:
      protocol: bean
      beanName: userService
      methodName: createUser
    securityCode: OFF

  - id: user-update
    path: /api/upms/user/update
    method: POST
    backend:
      protocol: bean
      beanName: userService
      methodName: updateUser
    securityCode: OFF

  - id: user-delete
