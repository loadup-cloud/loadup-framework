    method: POST
    backend:
      protocol: bean
      beanName: userService
      methodName: deleteUser
    securityCode: OFF

  - id: user-detail
    path: /api/upms/user/detail
    method: POST
    backend:
      protocol: bean
      beanName: userService
      methodName: getUserById
    securityCode: internal

  - id: user-list
    path: /api/upms/user/list
    method: POST
    backend:
      protocol: bean
      beanName: userService
      methodName: queryUsers
    securityCode: OFF

  - id: user-change-password
    path: /api/upms/user/change-password
    method: POST
    backend:
      protocol: bean
      beanName: userService
      methodName: changePassword
    securityCode: internal

  - id: user-lock
    path: /api/upms/user/lock
    method: POST
    backend:
      protocol: bean
      beanName: userService
      methodName: lockUser
    securityCode: OFF

  - id: user-unlock
    path: /api/upms/user/unlock
    method: POST
    backend:
      protocol: bean
      beanName: userService
      methodName: unlockUser
    securityCode: OFF

