spring:
  application:
    name: loadup-launcher
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/loadup-boot?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

# springdoc-openapi / knife4j configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: io.github.loadup
  paths-to-exclude: /actuator/**

# knife4j enhanced UI settings (available at /doc.html)
knife4j:
  enable: true
  setting:
    language: en
    swagger-model-name: Entity Model
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: "LoadUp Framework — Apache-2.0"

# LoadUp SpringDoc component properties (loadup-components-springdoc)
loadup:
  springdoc:
    enabled: true
    title: LoadUp API
    description: "LoadUp Framework — enterprise-grade backend platform REST API."
    version: 0.0.2-SNAPSHOT
    jwt-enabled: true
    contact:
      name: LoadUp Team
      url: https://github.com/loadup-cloud
      email: lslvxy@gmail.com
    license:
      name: Apache-2.0
      url: https://www.apache.org/licenses/LICENSE-2.0.txt

  gateway:
    enabled: true
    route-refresh-interval: 5
    template-cache-size: 100
    response:
      wrap: true
    default-timeout: 10000
    default-retry-count: 1
    # Proxy plugin configuration (kebab-case maps to camelCase fields in GatewayProperties)
    proxy-plugins:
      bean:
        enabled: true
      rpc:
        enabled: true
      http:
        enabled: true
        max-connections: 200

    # Storage plugin: choose 'type' and then configure the matching group
    storage:
      # type: FILE | DATABASE
      type: FILE
      # When type = FILE, configure the `file` group below
      file:
        base-path: classpath:gateway-routes.yml
  scheduler:
    type: simplejob
  tracer:
    enabled: false
    enable-web-tracing: true
    exclude-patterns: /actuator/**,/health,/metrics
    exporters:
      - type: logging

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}



logging:
  level:
    io.github.loadup: DEBUG
    org.springframework: INFO
