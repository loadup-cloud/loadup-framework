spring:
  application:
    name: loadup-launcher
  task:
    execution:
      propagate-context: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/loadup-boot?useUnicode=true&characterEncoding=utf8}
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# OpenAPI document generation
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  packages-to-scan: io.github.loadup
  paths-to-exclude: /actuator/**

# Scalar API reference UI
scalar:
  enabled: true
  path: /scalar

# LoadUp component and module properties
loadup:
  audit:
    web:
      include-paths:
        - /api/upms/*/create
        - /api/upms/*/update
        - /api/upms/*/delete
        - /api/upms/*/change-password
        - /api/upms/*/lock
        - /api/upms/*/unlock
        - /api/upms/*/move
        - /api/upms/*/assign-*
        - /api/upms/*/remove-*
        - /api/auth/login
        - /api/auth/register
        - /api/dictionaries/types/*
        - /api/dictionaries/items/*
        - /api/files
        - /api/files/*
        - /api/files/cleanup
        - /api/notifications
        - /api/notifications/*
        - /api/account/security/password
        - /api/transfer-tasks/imports
        - /api/transfer-tasks/exports
        - /api/transfer-tasks/retry
  transfer:
    max-input-bytes: 20971520
    max-output-bytes: 104857600
  dfs:
    binder-type: local
    binder:
      local:
        base-path: ${LOADUP_FILE_STORAGE_PATH:./data/files}
  springdoc:
    enabled: true
    title: LoadUp API
    description: "LoadUp Framework — enterprise-grade backend platform REST API."
    version: 0.0.2-SNAPSHOT
    jwt-enabled: true
    contact:
      name: LoadUp Team
      url: https://github.com/loadup-cloud
      email: lslvxy@gmail.com
    license:
      name: Apache-2.0
      url: https://www.apache.org/licenses/LICENSE-2.0.txt

  security:
    auth-server:
      issuer: ${AUTH_ISSUER:http://localhost:8080}
      audience: loadup-api
      protocol-endpoints-enabled: false
      user-access-token-ttl: 30m
      jwk:
        rsa-private-key-base64: ${AUTH_RSA_PRIVATE_KEY_BASE64:}
    resource-server:
      enabled: true
      issuer-uri: ${AUTH_ISSUER:http://localhost:8080}
      audience: loadup-api
      permit-all:
        - /api/auth/register
        - /api/auth/login

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}



logging:
  level:
    io.github.loadup: DEBUG
    org.springframework: INFO
