spring:
  application:
    name: loadup-launcher
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/loadup-boot?useUnicode=true&characterEncoding=utf8}
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# springdoc-openapi / knife4j configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: io.github.loadup
  paths-to-exclude: /actuator/**

# knife4j enhanced UI settings (available at /doc.html)
knife4j:
  enable: true
  setting:
    language: en
    swagger-model-name: Entity Model
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: "LoadUp Framework — Apache-2.0"

# LoadUp SpringDoc component properties (loadup-components-springdoc)
loadup:
  springdoc:
    enabled: true
    title: LoadUp API
    description: "LoadUp Framework — enterprise-grade backend platform REST API."
    version: 0.0.2-SNAPSHOT
    jwt-enabled: true
    contact:
      name: LoadUp Team
      url: https://github.com/loadup-cloud
      email: lslvxy@gmail.com
    license:
      name: Apache-2.0
      url: https://www.apache.org/licenses/LICENSE-2.0.txt

  security:
    resource-server:
      enabled: true
      issuer-uri: ${AUTH_ISSUER:http://localhost:8080}
      jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8080/oauth2/jwks}
      audience: loadup-api
      permit-all:
        - /api/auth/register
        - /api/auth/login

  components:
    authserver:
      issuer: ${AUTH_ISSUER:http://localhost:8080}
      audience: loadup-api
      jwk:
        rsa-private-key-base64: ${AUTH_RSA_PRIVATE_KEY_BASE64:}
      clients:
        - client-id: ${AUTH_CLIENT_ID:loadup-app}
          client-secret: ${AUTH_CLIENT_SECRET:change-me}
          grant-types: [authorization_code, refresh_token]
          redirect-uris: ["http://127.0.0.1:8080/login/oauth2/code/loadup"]
          scopes: [openid, profile]

  tracer:
    enabled: false
    enable-web-tracing: true
    exclude-patterns: /actuator/**,/health,/metrics
    exporters:
      - type: logging

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}



logging:
  level:
    io.github.loadup: DEBUG
    org.springframework: INFO
