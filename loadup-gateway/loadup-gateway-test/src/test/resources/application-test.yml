spring:
  application:
    name: loadup-gateway-test
  main:
    allow-bean-definition-overriding: true
loadup:
  gateway:
    enabled: true
    security:
      enabled: true
      secret: loadup-test-only-gateway-key-0123456789abcdef
      app-secrets:
        demo-app: loadup-signature-test-secret
    route-refresh-interval: 5

logging:
  level:
    io.github.loadup: DEBUG
    org.springframework: INFO
